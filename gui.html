<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JShell GUI</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
:root{--ac:#0078d4;--bg:#202020;--fg:#fff;--p:#2b2b2b;--p2:#3a3a3a;--wall:#0b3d91}
:root.light{--bg:#f3f3f3;--fg:#111;--p:#fff;--p2:#e3e3e3}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font:13px "Segoe UI","Yu Gothic UI",system-ui,sans-serif;color:var(--fg);background:#000;user-select:none}
.material-icons{font-size:20px;vertical-align:middle}
.hide{display:none!important}
input,textarea,button{font:inherit;color:inherit}
input{background:var(--p2);border:1px solid #777;padding:6px 8px;outline:0}input:focus{border-color:var(--ac)}
button{background:transparent;border:0;padding:6px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button:hover{background:rgba(128,128,128,.28)}
.pri{background:var(--ac);color:#fff}.danger{background:#b00020;color:#fff}
.sp{flex:1}.err{color:#ff8a8a;min-height:18px}.em{opacity:.6;padding:8px}.hint{opacity:.6;margin-top:18px;cursor:pointer}
.scr{position:fixed;inset:0;z-index:1000;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center}
.spin{animation:r 1s linear infinite;margin-top:20px}@keyframes r{to{transform:rotate(360deg)}}
.lg{display:flex;flex-direction:column;align-items:center;gap:10px;width:270px}
.lg .big{position:fixed;top:12vh;left:0;right:0;font-size:64px;font-weight:200}
.av .material-icons{font-size:110px}.pw{position:fixed;right:20px;bottom:20px}

#ic{padding:10px}.di{width:84px;text-align:center;padding:8px 4px;color:#fff;cursor:default}
.di .material-icons{font-size:44px;display:block;margin:auto}.di:hover{background:rgba(255,255,255,.15)}

#start button,#ctx button{justify-content:flex-start;padding:9px 10px}#start hr{width:100%;border:0;border-top:1px solid var(--p2)}
#ctx{position:fixed;z-index:700;background:var(--p);border:1px solid var(--p2);display:flex;flex-direction:column;width:200px}
.win{position:absolute;display:flex;flex-direction:column;background:var(--p);border:1px solid var(--ac);box-shadow:0 8px 30px #0008;resize:both;overflow:hidden;min-width:260px;min-height:160px}
.win.max{inset:0!important;width:auto!important;height:auto!important;resize:none}
.tb{display:flex;align-items:center;gap:6px;height:32px;padding-left:8px;background:var(--p2);touch-action:none}
.tb b{font-weight:400;white-space:nowrap;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}.tb button{height:32px;width:42px;padding:0;flex:none;justify-content:center;overflow:hidden;touch-action:manipulation}.tb .x:hover{background:#e81123;color:#fff}
.bd{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.term{flex:1;overflow:auto;background:#0c0c0c;color:#ccc;font:14px Consolas,monospace;padding:6px;user-select:text}
.term .out{white-space:pre-wrap;word-break:break-all}.in{display:flex}.in input{flex:1;background:none;border:0;color:inherit;font:inherit;padding:0}
.bar{display:flex;align-items:center;gap:4px;padding:4px;border-bottom:1px solid var(--p2)}.addr{flex:1}
.xp{flex:1;display:flex;min-height:0}.side{width:170px;border-right:1px solid var(--p2);overflow:auto;padding:4px;display:flex;flex-direction:column}
.side button{justify-content:flex-start}.side .on,.it.on,summary.on{background:color-mix(in srgb,var(--ac) 40%,transparent)}
.list{flex:1;overflow:auto;padding:6px}.it{display:flex;align-items:center;gap:8px;padding:5px 6px;cursor:default}.it .v{margin-left:auto;opacity:.7}
.bd textarea{flex:1;resize:none;background:var(--p);border:0;outline:0;padding:8px;font:14px Consolas,monospace;user-select:text}
.pg h3{margin:14px 0 6px}.sw{display:inline-block;width:34px;height:34px;margin:4px;cursor:pointer;border:2px solid transparent}.sw:hover{border-color:var(--fg)}
details{padding-left:12px}summary{cursor:default;list-style:none;padding:2px 4px;white-space:nowrap}
#uefi{background:#00a;font-family:Consolas,monospace;align-items:stretch;text-align:left}
.ub{margin:auto;width:min(1100px,96vw);height:min(780px,92vh);display:flex;flex-direction:column;font-size:17px;border:2px solid #aaa;background:#008}.ut{display:flex;background:#aaa}
.ut button{color:#000;padding:12px 22px}.ut .on{background:#00a;color:#fff}.uc{padding:20px;flex:1;overflow:auto}
.ur{display:flex;justify-content:space-between;width:100%;padding:10px 12px;gap:20px}button.ur:hover{background:#fff;color:#000}
.ub .hint{padding:8px 12px;margin:0;border-top:1px solid #aaa;cursor:default}
</style></head><body>
<div id=boot class=scr><div><span class=material-icons style="font-size:64px">window</span><div>JShell GUI</div><span class="material-icons spin">autorenew</span></div></div>
<div id=login class="scr hide"></div>
<div id=desk class=hide><div id=ic></div></div>
<div id=tbar class=hide></div><div id=start class=hide></div><div id=ctx class=hide></div>
<div id=uefi class="scr hide"></div>
<script>
const $=s=>document.querySelector(s),ico=n=>`<span class="material-icons">${n}</span>`,
esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const BOOT=()=>(((S.reg.HKEY_LOCAL_MACHINE||={}).SYSTEM||={}).Boot||={}),RK=()=>(((S.reg.HKEY_CURRENT_USER||={}).Software||={}).JShell||={});

async function hash(t){if(!crypto.subtle)return btoa(unescape(encodeURIComponent(t)));const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
/* ---- virtual FS ---- */
const seg=p=>p.split('/').filter(Boolean),get=p=>{let n=S.fs;for(const x of seg(p)){if(n.t!='d'||!n.c[x])return null;n=n.c[x]}return n};
const par=p=>seg(p).slice(0,-1).join('/'),nm=p=>seg(p).pop()||'',dir=()=>({t:'d',c:{}}),file=d=>({t:'f',d}),home=()=>'Users/'+S.user;

function initFs(u){S.fs=dir();for(const p of['Users','Users/'+u,'Users/'+u+'/Desktop','Users/'+u+'/Documents','Users/'+u+'/Downloads','Windows'])put(p,dir());put('Users/'+u+'/Documents/welcome.txt',file('JShell GUI へようこそ。'))}
const trashIt=p=>{const d=get(par(p)),n=nm(p);if(!d||!d.c[n])return 0;S.trash.push({n,node:d.c[n],from:p});delete d.c[n];save();dbin();return 1};
const norm=(p,cwd)=>{const o=[],b=/^[A-Za-z]:/.test(p)||p[0]=='/'||p[0]=='\\'?p.replace(/^[A-Za-z]:/,''):cwd+'/'+p;for(const x of b.split(/[\\/]/)){if(!x||x=='.')continue;x=='..'?o.pop():o.push(x)}return o.join('/')};
const disp=p=>'C:\\'+p.replaceAll('/','\\');
/* ---- window manager ---- */
const wins=new Map(),APPS={};let zi=10,wid=0,focused=0;
function openApp(name,arg){const A=APPS[name];if(!A)return;
 if(A.single)for(const w of wins.values())if(w.app==name){show(w);return w}
 const id=++wid,el=document.createElement('div'),W=A.size||[640,420],o=(id%8)*26;el.className='win';
 el.style.cssText=`left:${Math.max(0,Math.min(40+o,innerWidth-W[0]))}px;top:${24+o}px;width:${Math.min(W[0],innerWidth)}px;height:${Math.min(W[1],innerHeight-44)}px`;
 el.innerHTML=`<div class=tb>${ico(A.icon)}<b></b><button data-a=min>${ico('remove')}</button><button data-a=max>${ico('crop_square')}</button><button data-a=close class=x>${ico('close')}</button></div><div class=bd></div>`;
 const w={id,app:name,el,body:el.lastChild,A,min:false},tb=el.firstChild;w.title=t=>{el.querySelector('b').textContent=t};w.title(A.title);
 wins.set(id,w);if(innerWidth<700)el.classList.add('max');$('#desk').appendChild(el);
 el.addEventListener('pointerdown',()=>show(w),true);
 tb.addEventListener('pointerdown',e=>{if(e.target.closest('button')||el.classList.contains('max'))return;const r=el.getBoundingClientRect(),dx=e.clientX-r.left,dy=e.clientY-r.top;tb.setPointerCapture(e.pointerId);
  const mv=ev=>{el.style.left=Math.max(60-r.width,Math.min(innerWidth-60,ev.clientX-dx))+'px';el.style.top=Math.max(0,Math.min(innerHeight-80,ev.clientY-dy))+'px'},
  up=()=>{tb.removeEventListener('pointermove',mv);tb.removeEventListener('pointerup',up)};tb.addEventListener('pointermove',mv);tb.addEventListener('pointerup',up)});
 tb.addEventListener('dblclick',e=>{if(!e.target.closest('button'))el.classList.toggle('max')});
 tb.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;if(a=='close')closeW(w);if(a=='min')minW(w);if(a=='max')el.classList.toggle('max')});
 A.init(w,arg);show(w);return w}
function show(w){w.min=false;w.el.style.display='';w.el.style.zIndex=++zi;focused=w.id;tbar()}
function minW(w){w.min=true;w.el.style.display='none';tbar()}
function closeW(w){w.el.remove();wins.delete(w.id);tbar()}
const closeAll=()=>[...wins.values()].forEach(closeW);
function tbar(){const pins=[['explorer','folder'],['cmd','terminal'],['settings','settings']];
 $('#tbar').innerHTML=`<button id=sb>${ico('window')}</button>`+pins.map(([a,i])=>`<button data-o=${a}>${ico(i)}</button>`).join('')+'<span class=div></span>'+
 [...wins.values()].map(w=>`<button data-w=${w.id} class="${w.id==focused&&!w.min?'on':''}">${ico(w.A.icon)}<span>${esc(w.el.querySelector('b').textContent)}</span></button>`).join('')+`<i class=sp></i><div id=clk></div>`;clock()}
$('#tbar').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.id=='sb')return startMenu();if(b.dataset.o)openApp(b.dataset.o);
 if(b.dataset.w){const w=wins.get(+b.dataset.w);!w.min&&focused==w.id?minW(w):show(w)}};
const LIST=['explorer','cmd','notepad','settings','regedit','bin'];
function startMenu(f){const s=$('#start'),open=f??s.classList.contains('hide');s.classList.toggle('hide',!open);
 if(open)s.innerHTML=LIST.map(a=>`<button data-o=${a}>${ico(APPS[a].icon)}${APPS[a].title}</button>`).join('')+`<hr><button data-p=out>${ico('logout')}サインアウト</button><button data-p=re>${ico('restart_alt')}再起動</button><button data-p=fw>${ico('memory')}UEFIファームウェア設定</button><button data-p=off>${ico('power_settings_new')}シャットダウン</button>`}
$('#start').onclick=e=>{const b=e.target.closest('button');if(!b)return;startMenu(false);if(b.dataset.o)openApp(b.dataset.o);if(b.dataset.p)power(b.dataset.p)};
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#start,#sb'))startMenu(false);if(!e.target.closest('#ctx'))$('#ctx').classList.add('hide')});
$('#desk').oncontextmenu=e=>{e.preventDefault();if(e.target.closest('.win'))return;const c=$('#ctx');
 c.innerHTML=`<button data-o=settings>${ico('palette')}個人用設定</button><button data-o=cmd>${ico('terminal')}シェル</button>`;
 c.style.left=Math.min(e.clientX,innerWidth-205)+'px';c.style.top=Math.min(e.clientY,innerHeight-110)+'px';c.classList.remove('hide')};
$('#ctx').onclick=e=>{const b=e.target.closest('button');if(b){openApp(b.dataset.o);$('#ctx').classList.add('hide')}};
function clock(){const d=new Date(),t=d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}),c=$('#clk'),l=$('#lt');if(c)c.innerHTML=t+'<br>'+d.toLocaleDateString('ja-JP');if(l)l.textContent=t}
setInterval(clock,1000);
/* ---- boot / login / power ---- */
const hideAll=()=>{for(const i of['boot','login','uefi','desk','tbar','start','ctx'])$('#'+i).classList.add('hide');const o=$('#off');o&&o.remove()};
function boot(){apply();hideAll();$('#boot').classList.remove('hide');const b=BOOT(),bd=parseInt(b.BootDelay),d=b.FastBoot=='Enabled'?300:(isNaN(bd)?1200:bd);let done=0,t;
 let n=0;const go=f=>{if(done)return;done=1;clearTimeout(t);removeEventListener('keydown',kd);removeEventListener('pointerdown',pd);f()},
 kd=e=>{if(['F2','Delete','Escape'].includes(e.key)||(e.key=='Enter'&&++n>=3)){e.preventDefault();go(uefi)}},pd=()=>{if(++n>=3)go(uefi)};
 addEventListener('keydown',kd);addEventListener('pointerdown',pd);t=setTimeout(()=>go(S.user?loginScr:setupScr),d)}
const wall=()=>`linear-gradient(135deg,${RK().Wallpaper||'#0b3d91'},#000 170%)`;
function loginScr(){hideAll();const L=$('#login');L.style.background=wall();L.classList.remove('hide');
 L.innerHTML=`<div class=lg><div class=big id=lt></div><div class=av>${ico('account_circle')}</div><h2>${esc(S.user)}</h2>${S.pass?'<input id=lp type=password placeholder=パスワード>':''}<div id=le class=err></div><button id=lb class=pri>${ico('arrow_forward')}サインイン</button></div><div class=pw><button onclick="power('re')">${ico('restart_alt')}</button><button onclick="power('off')">${ico('power_settings_new')}</button></div>`;clock();
 const go=async()=>{if(S.pass&&await hash($('#lp').value)!=S.pass){$('#le').textContent='パスワードが正しくありません';$('#lp').value='';return}desktop()};
 $('#lb').onclick=go;const p=$('#lp');if(p){p.onkeydown=e=>{if(e.key=='Enter')go()};p.focus()}}
function setupScr(){hideAll();const L=$('#login');L.style.background=wall();L.classList.remove('hide');
 L.innerHTML=`<div class=lg><div class=av>${ico('person_add')}</div><h2>アカウントの作成</h2><input id=su placeholder=ユーザー名><input id=sp type=password placeholder="パスワード（空欄で無し）"><div id=le class=err></div><button id=lb class=pri>${ico('check')}作成</button></div>`;
 $('#lb').onclick=async()=>{const u=$('#su').value.trim();if(!/^[\w.-]{1,24}$/.test(u)){$('#le').textContent='ユーザー名は英数字と . _ - のみ（24文字まで）';return}
  S.user=u;S.pass=$('#sp').value?await hash($('#sp').value):null;initFs(u);save();desktop()}}
function desktop(){hideAll();apply();$('#desk').classList.remove('hide');$('#tbar').classList.remove('hide');dbin();tbar()}
function dbin(){const i=$('#ic');i.innerHTML=`<div class=di ondblclick="openApp('bin')">${ico(S.trash.length?'delete':'delete_outline')}<span>ごみ箱</span></div>`}
function power(k){closeAll();hideAll();if(k=='out')loginScr();else if(k=='re')boot();else if(k=='fw')uefi();
 else document.body.insertAdjacentHTML('beforeend','<div id=off class=scr onclick="boot()"><div><span class=material-icons style="font-size:48px">power_settings_new</span><div class=hint>シャットダウンしました。クリックで電源オン</div></div></div>')}
/* ---- UEFI ---- */
function uefi(){hideAll();closeAll();const U=$('#uefi');U.classList.remove('hide');const b=BOOT(),v={d:parseInt(b.BootDelay)||0,s:b.SecureBoot=='Enabled',f:b.FastBoot=='Enabled'},T=['Main','Boot','Security','Exit'],DL=[0,300,600,1200,3000,5000];let tab=0;

  if(tab==0)r=[['Firmware','JShell UEFI 2.0'],['CPU threads',navigator.hardwareConcurrency||'?'],['Memory hint',(navigator.deviceMemory||'?')+' GB'],['Display',screen.width+'x'+screen.height],['User',S.user||'(none)']].map(([a,c])=>`<div class=ur><span>${a}</span><span>${esc(c)}</span></div>`).join('');
  if(tab==1)r=`<button class=ur data-a=d><span>Boot Delay</span><span>${v.d} ms</span></button><button class=ur data-a=f><span>Fast Boot</span><span>${v.f?'Enabled':'Disabled'}</span></button>`;
  if(tab==2)r=`<button class=ur data-a=s><span>Secure Boot (virtual)</span><span>${v.s?'Enabled':'Disabled'}</span></button>`;
  if(tab==3)r=`<button class=ur data-a=save><span>Save Changes and Exit (F10)</span></button><button class=ur data-a=quit><span>Discard Changes and Exit (Esc)</span></button>`;
  U.innerHTML=`<div class=ub><div class=ut>${T.map((n,i)=>`<button data-t=${i} class="${i==tab?'on':''}">${n}</button>`).join('')}</div><div class=uc>${r}</div><div class=hint>←→ タブ　クリック/Enterで変更　F10 保存　Esc 破棄</div></div>`},
 exit=sv=>{removeEventListener('keydown',kd);if(sv){b.BootDelay=String(v.d);b.SecureBoot=v.s?'Enabled':'Disabled';b.FastBoot=v.f?'Enabled':'Disabled';save()}boot()},
 kd=e=>{if(e.key=='F10'){e.preventDefault();exit(1)}else if(e.key=='Escape')exit(0);else if(e.key=='ArrowRight'){tab=(tab+1)%4;render()}else if(e.key=='ArrowLeft'){tab=(tab+3)%4;render()}};
 addEventListener('keydown',kd);
 U.onclick=e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;if(d.t)tab=+d.t;else if(d.a=='d')v.d=DL[(DL.indexOf(v.d)+1)%DL.length];else if(d.a=='f')v.f=!v.f;else if(d.a=='s')v.s=!v.s;else if(d.a=='save')return exit(1);else if(d.a=='quit')return exit(0);render()};render()}
/* ---- apps ---- */
APPS.cmd={title:'シェル',icon:'terminal',size:[700,420],init(w){
 w.body.innerHTML='<div class=term><div class=out></div><div class=in><span class=ps></span><input spellcheck=false autocapitalize=none autocomplete=off></div></div>';
 const T=w.body.firstChild,out=T.querySelector('.out'),inp=T.querySelector('input'),ps=T.querySelector('.ps'),coarse=matchMedia('(pointer:coarse)').matches;let cwd=home(),hist=[],hi=0;
 const pr=(t='')=>{const d=document.createElement('div');d.textContent=t||' ';out.appendChild(d)},loc=p=>p==home()?'~':p.startsWith(home()+'/')?'~'+p.slice(home().length):'/'+p,pmt=()=>ps.textContent=`${S.user}@jshell:${loc(cwd)}> `,
 N=p=>norm(p.replace(/^~/,'/'+home()),cwd),fl=a=>a.filter(x=>!x.startsWith('-'));
 pr('JShell GUI 2.0.0');pr('help でコマンド一覧を表示します。');pr();pmt();
 const C={
  help(){pr('help ver clear echo ls cd pwd cat mkdir touch rm whoami date ps kill reg start exit');pr('start: explorer shell notepad settings regedit bin')},
  ver(){pr('JShell GUI 2.0.0')},clear(){out.innerHTML=''},echo(a){pr(a.join(' '))},whoami(){pr(S.user)},date(){pr(new Date().toString())},pwd(){pr('/'+cwd)},
  ls(a){a=fl(a);const p=a[0]?N(a[0]):cwd,n=get(p);if(!n)return pr(`ls: ${a[0]}: no such file or directory`);if(n.t!='d')return pr(nm(p));for(const[k,v]of Object.entries(n.c).sort())pr(k+(v.t=='d'?'/':''))},
  cd(a){const p=a[0]?N(a.join(' ')):home(),n=get(p);if(!n||n.t!='d')return pr(`cd: ${a[0]}: no such directory`);cwd=p},
  cat(a){for(const x of fl(a)){const n=get(N(x));if(!n||n.t!='f')pr(`cat: ${x}: no such file`);else n.d.split('\n').forEach(pr)}},
  mkdir(a){for(const x of fl(a))if(!put(N(x),dir()))pr(`mkdir: ${x}: cannot create directory`)},
  touch(a){for(const x of fl(a))if(!get(N(x))&&!put(N(x),file('')))pr(`touch: ${x}: cannot create file`)},
  rm(a){for(const x of fl(a))if(!trashIt(N(x)))pr(`rm: ${x}: no such file or directory`)},
  ps(){pr('ID   NAME');for(const x of wins.values())pr(String(x.id).padEnd(5)+x.A.title)},
  kill(a){const x=wins.get(+fl(a)[0]);x?closeW(x):pr('kill: no such process')},
  reg(){const walk=(o,p)=>{for(const[k,v]of Object.entries(o))typeof v=='object'?walk(v,p+'\\'+k):pr(p+'  '+k+' = '+v)};walk(S.reg,'')},
  start(a){const k=a[0]=='shell'?'cmd':a[0];APPS[k]?openApp(k):pr('usage: start explorer|shell|notepad|settings|regedit|bin')},
  exit(){closeW(w)}};
 C.version=C.ver;
 inp.onkeydown=e=>{if(!coarse&&(e.key=='Process'||e.isComposing))return;
  if(e.key=='Enter'){const l=inp.value.trim();inp.value='';pr(ps.textContent+l);if(l){hist.push(l);hi=hist.length;const[c,...a]=l.split(/\s+/),f=C[c.toLowerCase()];f?f(a):pr(`jshell: ${c}: command not found`)}pmt();T.scrollTop=T.scrollHeight}
  else if(e.key=='ArrowUp'){hi=Math.max(0,hi-1);inp.value=hist[hi]||'';e.preventDefault()}
  else if(e.key=='ArrowDown'){hi=Math.min(hist.length,hi+1);inp.value=hist[hi]||''}};
 T.onclick=()=>inp.focus();setTimeout(()=>inp.focus(),0)}};
APPS.explorer={title:'エクスプローラー',icon:'folder',size:[720,440],init(w,a={}){
 let p=a.path||home(),sel=null,bin=!!a.bin;if(bin)w.title('ごみ箱');const B=w.body,q=s=>B.querySelector(s);
 B.innerHTML=`<div class=bar><button data-c=up>${ico('arrow_upward')}</button><input class=addr readonly><button data-c=nd>${ico('create_new_folder')}</button><button data-c=nf>${ico('note_add')}</button><button data-c=del>${ico('delete')}</button><button data-c=rs>${ico('restore_from_trash')}</button><button data-c=em>${ico('delete_forever')}</button></div><div class=xp><div class=side></div><div class=list></div></div>`;
 const render=()=>{sel=null;q('.addr').value=bin?'ごみ箱':disp(p);
  q('.side').innerHTML=[['デスクトップ','desktop_windows',home()+'/Desktop'],['ドキュメント','description',home()+'/Documents'],['ダウンロード','download',home()+'/Downloads'],['ごみ箱','delete','']].map(([n,i,pp])=>`<button data-g="${pp}">${ico(i)}${n}</button>`).join('');
  let h='';
  if(bin)h=S.trash.map((t,i)=>`<div class=it data-i=${i}>${ico(t.node.t=='d'?'folder':'insert_drive_file')}<span>${esc(t.n)}</span></div>`).join('')||'<p class=em>ごみ箱は空です</p>';
  else{const n=get(p);if(!n||n.t!='d'){p=par(p);return render()}
   h=Object.entries(n.c).sort((x,y)=>(y[1].t=='d')-(x[1].t=='d')||x[0].localeCompare(y[0])).map(([k,v])=>`<div class=it data-n="${esc(k)}">${ico(v.t=='d'?'folder':'insert_drive_file')}<span>${esc(k)}</span></div>`).join('')||'<p class=em>このフォルダーは空です</p>'}
  q('.list').innerHTML=h;for(const k of['up','nd','nf'])q(`[data-c=${k}]`).hidden=bin;for(const k of['rs','em'])q(`[data-c=${k}]`).hidden=!bin};
 B.onclick=e=>{const g=e.target.closest('[data-g]'),it=e.target.closest('.it'),c=e.target.closest('[data-c]');
  if(g){bin=!g.dataset.g;w.title(bin?'ごみ箱':'エクスプローラー');if(!bin)p=g.dataset.g;render();return}
  if(it){B.querySelectorAll('.it.on').forEach(x=>x.classList.remove('on'));it.classList.add('on');sel=it;return}
  if(!c)return;const k=c.dataset.c;
  if(k=='up'){p=par(p);render()}
  if(k=='nd'||k=='nf'){const n=prompt(k=='nd'?'フォルダー名':'ファイル名');if(n&&!/[\\/]/.test(n)){put(p+'/'+n,k=='nd'?dir():file(''));render()}}
  if(k=='del'&&sel){if(bin){S.trash.splice(+sel.dataset.i,1);save();dbin()}else trashIt(p+'/'+sel.dataset.n);render()}
  if(k=='rs'&&sel){const t=S.trash[+sel.dataset.i];if(!put(t.from,t.node))put(home()+'/'+t.n,t.node);S.trash.splice(+sel.dataset.i,1);save();dbin();render()}
  if(k=='em'){S.trash=[];save();dbin();render()}};
 B.ondblclick=e=>{const it=e.target.closest('.it');if(!it||bin)return;const n=it.dataset.n,f=get(p+'/'+n);if(f.t=='d'){p=p+'/'+n;render()}else openApp('notepad',{path:p+'/'+n})};
 render()}};
APPS.bin={title:'ごみ箱',icon:'delete',single:true,size:[560,380],init(w){APPS.explorer.init(w,{bin:1})}};
APPS.notepad={title:'メモ帳',icon:'description',size:[520,360],init(w,a={}){let path=a.path||'';const B=w.body;
 B.innerHTML=`<div class=bar><button data-c=s>${ico('save')}保存</button></div><textarea spellcheck=false></textarea>`;const t=B.querySelector('textarea');
 if(path){const n=get(path);t.value=n?.d||'';w.title(nm(path)+' - メモ帳')}
 B.querySelector('[data-c=s]').onclick=()=>{if(!path){const n=prompt('ファイル名（ドキュメントに保存）','新しいテキスト.txt');if(!n||/[\\/]/.test(n))return;path=home()+'/Documents/'+n;w.title(n+' - メモ帳')}
  const f=get(path);f&&f.t=='f'?(f.d=t.value,save()):put(path,file(t.value))}}};
APPS.settings={title:'設定',icon:'settings',single:true,size:[760,480],init(w){const B=w.body;B.innerHTML='<div class=xp><div class="side set"></div><div class="list pg"></div></div>';let page='p';
 const NAV=[['p','palette','個人用設定'],['a','person','アカウント'],['s','info','システム情報'],['b','memory','ブートとUEFI']],SW=a=>a.map(c=>`<i class=sw style="background:${c}" data-v="${c}"></i>`).join('');
 const render=()=>{B.querySelector('.set').innerHTML=NAV.map(([k,i,n])=>`<button data-k=${k} class="${k==page?'on':''}">${ico(i)}${n}</button>`).join('');const g=B.querySelector('.pg');
  if(page=='p')g.innerHTML=`<h3>テーマ</h3><button data-t=dark>${ico('dark_mode')}ダーク</button><button data-t=light>${ico('light_mode')}ライト</button><h3>アクセントカラー</h3><div data-x=Accent>${SW(['#0078d4','#e81123','#107c10','#ff8c00','#8e24aa','#00b7c3'])}</div><h3>壁紙</h3><div data-x=Wallpaper>${SW(['#0b3d91','#1b5e20','#4a148c','#b71c1c','#263238','#004d40'])}</div>`;
  if(page=='a')g.innerHTML=`<h3>${esc(S.user)}</h3><p>パスワード: ${S.pass?'設定済み':'なし'}</p><input id=np type=password placeholder=新しいパスワード> <button data-c=pw>${ico('key')}変更</button> <button data-c=nopw>パスワードを削除</button>`;
  if(page=='s')g.innerHTML=`<h3>JShell GUI 2.0.0</h3><p>ブラウザ: ${esc(navigator.userAgent)}</p><p>画面: ${screen.width}x${screen.height}</p><p>論理CPU: ${navigator.hardwareConcurrency||'?'}</p><p>保存データ: ${(JSON.stringify(S).length/1024).toFixed(1)} KB</p><button data-c=reset class=danger>${ico('warning')}初期化（全データ削除）</button>`;
  if(page=='b')g.innerHTML=`<p>UEFI設定はレジストリ HKLM\\SYSTEM\\Boot に保存されます。</p><button data-c=fw>${ico('memory')}UEFIファームウェア設定へ再起動</button>`};
 B.onclick=async e=>{const t=e.target.closest('button,.sw');if(!t)return;const d=t.dataset;
  if(d.k){page=d.k;render()}else if(d.t){RK().Theme=d.t;save();apply()}else if(d.v){RK()[t.parentNode.dataset.x]=d.v;save();apply()}
  else if(d.c=='pw'){const v=B.querySelector('#np').value;if(v){S.pass=await hash(v);save();render()}}
  else if(d.c=='nopw'){S.pass=null;save();render()}
  else if(d.c=='reset'){if(confirm('すべてのデータを削除して初期化します。よろしいですか？')){localStorage.removeItem(KEY);location.reload()}}
  else if(d.c=='fw')power('fw')};
 render()}};
APPS.regedit={title:'レジストリ エディター',icon:'account_tree',size:[760,460],init(w){const B=w.body;let path=[];
 B.innerHTML=`<div class=bar><button data-c=nv>${ico('add')}値</button><button data-c=nk>${ico('create_new_folder')}キー</button><button data-c=dk>${ico('delete')}キー削除</button><span class=sp></span><span class=em></span></div><div class=xp><div class="side tree"></div><div class="list vals"></div></div>`;
 const at=pa=>pa.reduce((o,k)=>o&&o[k],S.reg),J=a=>a.join('\\');
 const tree=(o,pa)=>Object.entries(o).filter(([,v])=>typeof v=='object').map(([k,v])=>{const np=[...pa,k];return`<details ${J(path).startsWith(J(np))?'open':''}><summary class="${J(np)==J(path)?'on':''}" data-p="${esc(JSON.stringify(np))}">${ico('folder')}${esc(k)}</summary>${tree(v,np)}</details>`}).join('');
 const render=()=>{B.querySelector('.tree').innerHTML=tree(S.reg,[]);const o=at(path);
  B.querySelector('.vals').innerHTML=o?Object.entries(o).filter(([,v])=>typeof v!='object').map(([k,v])=>`<div class=it data-k="${esc(k)}">${ico('tune')}<span>${esc(k)}</span><span class=v>${esc(v)}</span></div>`).join('')||'<p class=em>値がありません</p>':'<p class=em>キーを選択してください</p>';
  B.querySelector('.bar .em').textContent=J(path)};
 B.onclick=e=>{const s=e.target.closest('summary'),it=e.target.closest('.it'),c=e.target.closest('[data-c]');
  if(s){path=JSON.parse(s.dataset.p);render();return}
  const o=at(path);
  if(it&&o){const k=it.dataset.k,v=prompt(J(path)+'\\'+k+' の値',o[k]);if(v!==null){o[k]=v;save();apply();render()}return}
  if(!c||!o)return;const k=c.dataset.c;
  if(k=='nv'){const n=prompt('値の名前');if(n){o[n]='';save();render()}}
  if(k=='nk'){const n=prompt('キー名');if(n){o[n]={};save();render()}}
  if(k=='dk'&&path.length>1&&confirm('キーを削除しますか？')){const pp=path.slice(0,-1);delete at(pp)[path.at(-1)];path=pp;save();apply();render()}};
 render()}};
apply();boot();
</script></body></html>
