<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JShell GUI</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
:root{--ac:#0078d4;--bg:#202020;--fg:#fff;--p:#2b2b2b;--p2:#3a3a3a;--wall:#0b3d91}
:root.light{--bg:#f3f3f3;--fg:#111;--p:#fff;--p2:#e3e3e3}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font:13px "Segoe UI","Yu Gothic UI",system-ui,sans-serif;color:var(--fg);background:#000;user-select:none}
.material-icons{font-size:20px;vertical-align:middle}
.hide{display:none!important}
input,textarea,button{font:inherit;color:inherit}
input{background:var(--p2);border:1px solid #777;padding:6px 8px;outline:0}input:focus{border-color:var(--ac)}
button{background:transparent;border:0;padding:6px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button:hover{background:rgba(128,128,128,.28)}
.pri{background:var(--ac);color:#fff}.danger{background:#b00020;color:#fff}
.sp{flex:1}.err{color:#ff8a8a;min-height:18px}.em{opacity:.6;padding:8px}.hint{opacity:.6;margin-top:18px;cursor:pointer}
.scr{position:fixed;inset:0;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);z-index:1000;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center}
.spin{animation:r 1s linear infinite;margin-top:20px}@keyframes r{to{transform:rotate(360deg)}}
.lg{display:flex;flex-direction:column;align-items:center;gap:10px;width:270px}
.lg .big{position:fixed;top:12vh;left:0;right:0;font-size:64px;font-weight:200}
.av .material-icons{font-size:110px}.pw{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px))}
#desk{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:calc(44px + env(safe-area-inset-bottom,0px));background:linear-gradient(135deg,var(--wall),#000 170%);overflow:hidden}
#ic{padding:10px}.di{width:84px;text-align:center;padding:8px 4px;color:#fff;cursor:default}
.di .material-icons{font-size:44px;display:block;margin:auto}.di:hover{background:rgba(255,255,255,.15)}
#tbar{position:fixed;left:0;right:0;bottom:0;height:calc(44px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px)!important;background:var(--p);border-top:1px solid var(--p2);display:flex;align-items:center;gap:2px;padding:0 6px;z-index:500}
#tbar button{height:36px;max-width:170px}#tbar button.on{background:rgba(128,128,128,.3);box-shadow:inset 0 -3px var(--ac)}
#tbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.div{width:1px;height:24px;background:var(--p2);margin:0 4px}
#clk{text-align:right;font-size:11px;padding:0 8px;white-space:nowrap}

#start button,#ctx button{justify-content:flex-start;padding:9px 10px}#start hr{width:100%;border:0;border-top:1px solid var(--p2)}
#ctx{position:fixed;z-index:700;background:var(--p);border:1px solid var(--p2);display:flex;flex-direction:column;width:200px}
.win{position:absolute;display:flex;flex-direction:column;background:var(--p);border:1px solid var(--ac);box-shadow:0 8px 30px #0008;resize:both;overflow:hidden;min-width:260px;min-height:160px}
.win.max{inset:0!important;width:auto!important;height:auto!important;resize:none}
.tb{display:flex;align-items:center;gap:6px;height:32px;padding-left:8px;background:var(--p2);touch-action:none}
.tb b{font-weight:400;white-space:nowrap;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}.tb button{height:32px;width:42px;padding:0;flex:none;justify-content:center;overflow:hidden;touch-action:manipulation}.tb .x:hover{background:#e81123;color:#fff}
.noicon .tb .material-icons{display:none}.noicon .tb button::before{content:attr(data-s);font-size:18px}
.bd{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.term{flex:1;overflow:auto;background:#0c0c0c;color:#ccc;font:14px Consolas,monospace;padding:6px;user-select:text}
.term .out{white-space:pre-wrap;word-break:break-all}.in{display:flex}.in input{flex:1;background:none;border:0;color:inherit;font:inherit;padding:0}
.bar{display:flex;align-items:center;gap:4px;padding:4px;border-bottom:1px solid var(--p2)}.addr{flex:1}
.xp{flex:1;display:flex;min-height:0}.side{width:170px;border-right:1px solid var(--p2);overflow:auto;padding:4px;display:flex;flex-direction:column}
.side button{justify-content:flex-start}.side .on,.it.on,summary.on{background:color-mix(in srgb,var(--ac) 40%,transparent)}
.list{flex:1;overflow:auto;padding:6px}.it{display:flex;align-items:center;gap:8px;padding:5px 6px;cursor:default}.it .v{margin-left:auto;opacity:.7}

.pg h3{margin:14px 0 6px}.sw{display:inline-block;width:34px;height:34px;margin:4px;cursor:pointer;border:2px solid transparent}.sw:hover{border-color:var(--fg)}
details{padding-left:12px}summary{cursor:default;list-style:none;padding:2px 4px;white-space:nowrap}
#uefi{background:#00a;font-family:Consolas,monospace;align-items:stretch;text-align:left}
.ub{margin:auto;width:min(1100px,96vw);height:min(780px,92vh);display:flex;flex-direction:column;font-size:17px;border:2px solid #aaa;background:#008}.ut{display:flex;background:#aaa}

.ur{display:flex;justify-content:space-between;width:100%;padding:10px 12px;gap:20px}button.ur:hover{background:#fff;color:#000}
.ub .hint{padding:8px 12px;margin:0;border-top:1px solid #aaa;cursor:default}
.tl{display:flex;align-items:center;white-space:nowrap;padding:2px 4px;cursor:default}.tl:hover{background:rgba(128,128,128,.2)}.tl.on{background:color-mix(in srgb,var(--ac) 40%,transparent)}
.tp{font:13px Consolas,monospace;white-space:pre;opacity:.45}.tl .material-icons{margin-right:5px;color:var(--ac)}.side.tr{width:min(270px,46%)}.it.bad{color:#ff7b7b}
.ur.sel{background:#fff;color:#000}
#bsod,#re{background:#0a62b4;align-items:flex-start;text-align:left;overflow:auto}#bsod{z-index:2000}
#bsod>div{margin:7vh 7vw;max-width:900px}#bsod .sad{font-size:min(20vw,140px);line-height:1;margin-bottom:10px}#bsod p{font-size:min(5vw,24px);margin:14px 0;line-height:1.5}#bsod small{font-size:13px;display:block;margin-top:8px;opacity:.9}
.re{width:100%;padding:6vh 6vw}.re h1{font-weight:300;font-size:30px;margin:0 0 26px}.rg{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;align-items:start}
.ri{display:flex;gap:16px;padding:14px;border:2px solid transparent;background:rgba(255,255,255,.1);text-align:left;align-items:flex-start;width:100%;color:#fff}
.ri .material-icons{font-size:34px;flex:none;width:34px;height:34px;overflow:hidden}.ri>div{min-width:0}.ri b{font-weight:400;font-size:18px;display:block}.ri .d{font-size:12px;opacity:.85;display:block;margin-top:3px}.ri.sel,.ri:hover{border-color:#fff;background:rgba(255,255,255,.2)}
.rb{display:inline-flex;gap:10px;align-items:center;margin-bottom:24px;cursor:pointer}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes wc{to{opacity:0;transform:scale(.95)}}
.win{animation:pop .16s ease-out}.win.closing{animation:wc .14s ease-in forwards;pointer-events:none}
#start:not(.hide),#ctx:not(.hide){animation:up .15s ease-out}#desk:not(.hide){animation:fade .5s}.scr{animation:fade .3s}.lg{animation:up .4s ease-out}
button,.tl,.it,.di{transition:background .12s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id=boot class=scr><div><span class=material-icons style="font-size:64px">window</span><div>JShell GUI</div><span class="material-icons spin">autorenew</span></div></div>

<div id=uefi class="scr hide"></div><div id=bsod class="scr hide"></div><div id=re class="scr hide"></div>
<script>
const $=s=>document.querySelector(s),ico=n=>`<span class="material-icons">${n}</span>`,

 let n=0;const iv=setInterval(()=>{n=Math.min(100,n+1+Math.floor(Math.random()*9));$('#bp').textContent=n;if(n>=100){clearInterval(iv);B.firstChild.insertAdjacentHTML('beforeend','<p>再起動します...</p>');setTimeout(()=>{crashed=0;boot()},1500)}},280)}
function reSpin(t){reOff();hideAll();const R=$('#re');R.classList.remove('hide');R.onclick=null;R.innerHTML=`<div class=re style="text-align:center;padding-top:22vh"><span class="material-icons spin" style="font-size:52px">autorenew</span><h1 style="margin-top:20px">${t}</h1></div>`}
function reNote(t,p,fn,btn='OK'){reOff();hideAll();const R=$('#re');R.classList.remove('hide');
 R.innerHTML=`<div class=re><h1>${t}</h1><p style="max-width:720px;line-height:1.7">${p}</p><div class=rg style="max-width:360px"><button class="ri sel" data-a=1>${ico('check')}<div><b>${btn}</b></div></button></div></div>`;
 R.onclick=e=>{if(e.target.closest('[data-a]'))(fn||(()=>reShow('adv')))()};reKd=e=>{if(e.key=='Enter'||e.key=='Escape'){e.preventDefault();R.onclick({target:R.querySelector('[data-a]')})}};addEventListener('keydown',reKd)}
function autoRepair(){reSpin('自動修復を準備しています');setTimeout(()=>reSpin('PC を診断中...'),2200);setTimeout(()=>{reOff();const R=$('#re'),b=badReg();
 R.innerHTML=`<div class=re><h1>PC が正常に起動しませんでした</h1><p style="max-width:720px;line-height:1.7">自動修復で PC を修復できませんでした。[再起動] を押して PC を再起動すると、問題が解決できることがあります。[詳細オプション] を押して、その他の方法で PC を修復することもできます。</p>${b.length?`<p style="font:12px Consolas,monospace;opacity:.85">原因: 無効なレジストリ値 ${esc(b[0].replace(/\//g,'\\'))}</p>`:''}<div class=rg style="max-width:420px"><button class="ri sel" data-a=r>${ico('restart_alt')}<div><b>再起動</b></div></button><button class=ri data-a=o>${ico('tune')}<div><b>詳細オプション</b></div></button></div></div>`;

function reCmd(){reOff();hideAll();const R=$('#re');R.classList.remove('hide');R.onclick=null;
 R.innerHTML='<div class=re style="background:#000;min-height:100%;font:14px Consolas,monospace;user-select:text;padding:14px"><div id=co></div><div style="display:flex">X:\\Sources&gt;&nbsp;<input id=ci style="flex:1;background:none;border:0;color:#fff;font:inherit;padding:0" autocapitalize=none autocomplete=off></div></div>';
 const co=$('#co'),ci=$('#ci'),pr=t=>{const d=document.createElement('div');d.textContent=t||' ';co.appendChild(d)};pr('JShell Recovery Console [Version 2.0.0]');pr('Type help for a list of commands.');

  if(c=='help')pr('help  reg  repair  restore  exit');else if(c=='reg'){const b=badReg();b.length?b.forEach(x=>pr('INVALID '+x.replace(/\//g,'\\'))):pr('No registry problems found.')}else if(c=='repair')repair();else if(c=='restore')restore();else if(c=='exit')reShow('adv');else if(c)pr(`'${c}' is not recognized.`)};ci.focus()}
const REP={main:{t:'オプションの選択',items:[['arrow_forward','続行','終了して JShell GUI に続行します',()=>boot()],['album','デバイスの使用','USB ドライブ、ネットワーク接続、または JShell 回復 DVD を使用します',()=>reNote('デバイスの使用','利用できるデバイスが見つかりません。',()=>reShow('main'))],['build','トラブルシューティング','PC の初期化または詳細オプションを表示します','ts'],['power_settings_new','PC の電源を切る','',()=>power('off')]]},
 ts:{t:'トラブルシューティング',back:'main',items:[['restart_alt','このPCを初期状態に戻す','すべてのデータを削除して JShell GUI を初期状態に戻します',reReset],['tune','詳細オプション','スタートアップ修復、システムの復元など','adv']]},

function reShow(pg){reOff();hideAll();const R=$('#re'),P=REP[pg],n=P.items.length;let sel=0;R.classList.remove('hide');
 R.innerHTML=`<div class=re>${P.back?`<div class=rb data-b=1>${ico('arrow_back')}<span style="font-size:22px">${P.t}</span></div>`:`<h1>${P.t}</h1>`}<div class=rg>${P.items.map(([i,t,d],k)=>`<button class="ri ${k?'':'sel'}" data-k=${k}>${ico(i)}<div><b>${t}</b><span class=d>${d}</span></div></button>`).join('')}</div><div class=hint style="cursor:default;margin-top:30px">Arrow keys: Select　Enter: OK　Esc: Back</div></div>`;

const trashIt=p=>{const d=get(par(p)),n=nm(p);if(!d||!d.c[n])return 0;S.trash.push({n,node:d.c[n],from:p});delete d.c[n];save();dbin();return 1};

const disp=p=>'C:\\'+p.replaceAll('/','\\');
/* ---- window manager ---- */
const wins=new Map(),APPS={};let zi=10,wid=0,focused=0;
function openApp(name,arg){const A=APPS[name];if(!A)return;
